version: '3.8'

services:
  postgres-db:
    image: postgres:17-alpine
    container_name: stackoverflow-db-local
    environment:
      - POSTGRES_DB=stackoverflow_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_local_data:/var/lib/postgresql/data

volumes:
  pg_local_data: